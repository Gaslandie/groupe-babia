name: Deploy Groupe Babia to Bluehost

on:
  # Declenchement automatique volontairement desactive tant que le compte FTP
  # cloisonne et les secrets ne sont pas crees : sans eux, chaque push produit
  # un echec. A reactiver en retirant les commentaires ci-dessous, une fois le
  # premier envoi manuel valide.
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifier la destination avant tout envoi
        run: |
          if grep -q '__CONFIRMER_SERVER_DIR_FTP_CLOISONNE__' .github/workflows/deploy.yml; then
            echo "::error::server-dir non configure. Le compte Bluehost heberge d'autres sites clients : un envoi vers un repertoire non confirme ecrirait chez eux. Renseigner server-dir avant de relancer."
            exit 1
          fi

      - name: Deploy static site by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # A confirmer apres creation du compte FTP cloisonne.
          # Repertoire serveur reel : /home2/fnksrwmy/groupebabia.com
          # Si le compte FTP est bien cloisonne sur ce repertoire, le server-dir
          # vu par ce compte devrait etre "/" ; ne pas deviner avant test.
          server-dir: __CONFIRMER_SERVER_DIR_FTP_CLOISONNE__/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            scripts/**
            README.md
            AGENTS.md
            CLAUDE.md
