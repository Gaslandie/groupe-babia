name: Deploy Groupe Babia to Bluehost

on:
  # Declenchement automatique volontairement desactive tant que le compte FTP
  # cloisonne et les secrets ne sont pas crees : sans eux, chaque push produit
  # un echec. A reactiver en retirant les commentaires ci-dessous, une fois le
  # premier envoi manuel valide.
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifier la destination avant tout envoi
        run: |
          if awk '$1 == "server-dir:" && $2 ~ /__CONFIRMER_SERVER_DIR_FTP_CLOISONNE__/ { found=1 } END { exit !found }' .github/workflows/deploy.yml; then
            echo "::error::server-dir non configure. Le compte Bluehost heberge d'autres sites clients : un envoi vers un repertoire non confirme ecrirait chez eux. Renseigner server-dir avant de relancer."
            exit 1
          fi

      - name: Deploy static site by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Compte FTP cree pour le repertoire Bluehost confirme :
          # /home2/fnksrwmy/public_html/groupebabia.com
          # Le compte etant cloisonne sur ce dossier, sa racine FTP est "/".
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            admin/**
            app/**
            database/**
            docs/**
            scripts/**
            .env.example
            build.php
            *.php
            README.md
            AGENTS.md
            CLAUDE.md
